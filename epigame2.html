<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

.carousel {
  display: flex;
  width: 800%;
  height: 100vh;
  transition: transform 0.3s;
}

.slide {
  width: 100%;
  flex-shrink: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  background: #f0f0f0;
}

button {
  margin-top: 10px;
  padding: 10px;
}
</style>
</head>

<body>

<div id="carousel" class="carousel">

 <div class="slide">
  <h2>Módulo 1</h2>
  <video controls width="300">
    <source src="cena01.mp4" type="video/mp4">
    Seu navegador não suporta vídeo
  </video>
  <button onclick="next()">Próximo</button>
</div>

<div class="slide">
  <h2>Módulo 2</h2>
  <video controls width="300">
    <source src="cena02.mp4" type="video/mp4">
  </video>
  <button onclick="next()">Próximo</button>
</div>

<div class="slide">
  <h2>Módulo 3</h2>
  <video controls width="300">
    <source src="cena03.mp4" type="video/mp4">
  </video>
  <button onclick="next()">Próximo</button>
</div>

<div class="slide">
  <h2>Módulo 4</h2>
  <video controls width="300">
    <source src="cena04.mp4" type="video/mp4">
  </video>
  <button onclick="next()">Próximo</button>
</div>

  <div class="slide">
    <h2>Qual protege os pés?</h2>
    <button onclick="alert('Errado')">Chinelo</button>
    <button onclick="alert('Correto')">Bota</button>
    <button onclick="next()">Próximo</button>
  </div>

  <div class="slide"><h2>Jogo 2</h2><button onclick="next()">Próximo</button></div>
  <div class="slide"><h2>Jogo 3</h2><button onclick="next()">Próximo</button></div>

  <div class="slide"><h2>Fim 🎉</h2></div>

</div>

<script>
let index = 0;
const carousel = document.getElementById("carousel");

function next() {
  index++;
  carousel.style.transform = "translateX(-" + (index * 100) + "%)";
}
</script>

</body>
</html>
